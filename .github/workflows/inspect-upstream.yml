name: Inspect official Omarchy ISO
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: inspect-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools fdisk mtools dosfstools gnupg jq time sbsigntool file binutils
      - name: Measure runner and check space
        run: source scripts/common.sh; preflight
      - id: source
        run: echo "sha=$(jq -r .sha256 configs/upstream.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: work/source/upstream.iso
          key: official-omarchy-sha256-${{ steps.source.outputs.sha }}
      - name: Authenticate official ISO
        run: /usr/bin/time -v -o out/download-time.txt bash scripts/download-upstream.sh
      - name: Inspect inert files
        run: /usr/bin/time -v -o out/inspection-time.txt bash scripts/inspect-iso.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: upstream-inspection-${{ github.run_id }}
          path: out/
          include-hidden-files: true
          retention-days: 14
      - name: Cleanup extracted data
        if: always()
        run: sudo rm -rf -- work/iso
