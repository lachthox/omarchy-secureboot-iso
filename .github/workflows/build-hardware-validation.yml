name: Build and test signed read-only hardware media
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [codex/guarded-wizard]
    paths: ['.github/workflows/build-hardware-validation.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: hardware-media-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/install-tools.sh build
      - run: bash scripts/prepare-runner-space.sh
      - run: |
          sudo apt-get install -y --no-install-recommends systemd-boot-efi=255.4-1ubuntu8.18 systemd-ukify=255.4-1ubuntu8.18
          python3 -m venv --system-site-packages work/secureboot-tools
          work/secureboot-tools/bin/pip install --no-deps virt-firmware==26.10 pefile==2024.8.26
          bash scripts/prepare-installed-tools.sh
      - id: source
        run: echo "sha=$(jq -r .sha256 configs/upstream.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: work/source/upstream.iso
          key: official-omarchy-sha256-${{ steps.source.outputs.sha }}
      - run: bash scripts/download-upstream.sh
      - run: bash scripts/inspect-iso.sh
      - run: bash scripts/extract-iso.sh
      - run: bash scripts/patch-iso.sh
      - run: bash scripts/rebuild-iso.sh
      - run: bash scripts/verify-iso.sh
      - name: Free completed filesystem build intermediates
        run: sudo rm -rf -- work/rootfs work/iso work/custom.sfs
      - run: bash scripts/build-audit-media.sh
      - name: Test the actual signed ISO and enrollment flow
        run: python3 tests/secureboot/audit-media.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hardware-validation-iso
          path: out/hardware-validation/
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hardware-validation-reports
          path: |
            out/secure-live/
            out/audit-media/
            out/*space*.txt
            out/installed-shim-signatures.txt
          retention-days: 14
