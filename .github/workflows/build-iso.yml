name: Build diagnostic Omarchy ISO
on:
  workflow_dispatch:
    inputs:
      full_install:
        description: Run slower unattended installation acceptance
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_install:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.ref }}-${{ inputs.full_install || false }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools fdisk gnupg jq time qemu-system-x86 qemu-utils ovmf dosfstools mtools gdisk
      - run: source scripts/common.sh; MIN_FREE_BYTES=40000000000 preflight
      - id: source
        run: echo "sha=$(jq -r .sha256 configs/upstream.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: work/source/upstream.iso
          key: official-omarchy-sha256-${{ steps.source.outputs.sha }}
      - run: /usr/bin/time -v -o out/download-time.txt bash scripts/download-upstream.sh
      - run: /usr/bin/time -v -o out/inspection-time.txt bash scripts/inspect-iso.sh
      - run: /usr/bin/time -v -o out/extraction-time.txt bash scripts/extract-iso.sh
      - run: bash scripts/patch-iso.sh
      - run: /usr/bin/time -v -o out/rebuild-time.txt bash scripts/rebuild-iso.sh
      - id: verify
        run: bash scripts/verify-iso.sh
      - name: Test the ISO already on this runner
        uses: ./.github/actions/vm-test
        with:
          full_install: ${{ inputs.full_install || false }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.verify.outcome == 'success'
        with:
          name: diagnostic-iso
          path: out/image/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Remove large intermediates and record space
        if: always()
        run: |
          df -B1 . > out/final-space.txt
          sudo rm -rf -- work/rootfs work/iso work/custom.sfs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: build-reports
          path: |
            out/*.txt
            out/*.json
            out/inspection/
            out/qemu/
          include-hidden-files: true
          retention-days: 14
