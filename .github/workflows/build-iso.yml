name: Build diagnostic Omarchy ISO
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools fdisk gnupg jq time
      - run: source scripts/common.sh; MIN_FREE_BYTES=40000000000 preflight
      - id: source
        run: echo "sha=$(jq -r .sha256 configs/upstream.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: work/source/upstream.iso
          key: official-omarchy-sha256-${{ steps.source.outputs.sha }}
      - run: /usr/bin/time -v -o out/download-time.txt bash scripts/download-upstream.sh
      - run: /usr/bin/time -v -o out/inspection-time.txt bash scripts/inspect-iso.sh
      - run: /usr/bin/time -v -o out/extraction-time.txt bash scripts/extract-iso.sh
      - run: bash scripts/patch-iso.sh
      - run: /usr/bin/time -v -o out/rebuild-time.txt bash scripts/rebuild-iso.sh
      - run: bash scripts/verify-iso.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-iso
          path: out/image/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Remove large intermediates and record space
        if: always()
        run: |
          df -B1 . > out/final-space.txt
          sudo rm -rf -- work/rootfs work/iso work/custom.sfs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: build-reports
          path: |
            out/*.txt
            out/*.json
            out/inspection/
          include-hidden-files: true
          retention-days: 14
  test:
    needs: build
    uses: ./.github/workflows/test-iso.yml
