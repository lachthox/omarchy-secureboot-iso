name: Repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/disk-safety -v
      - name: Syntax checks
        run: |
          python3 -m compileall -q scripts installer tests
          find scripts tests installer -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
