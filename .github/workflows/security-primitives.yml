name: Firmware signature and update transaction acceptance
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/install-tools.sh build
      - name: Discover EFI development tooling
        run: |
          apt-cache policy gnu-efi python3-cryptography python3-yaml python3-requests
          sudo apt-get install -y --no-install-recommends gnu-efi=3.0.18-1
          python3 -m venv --system-site-packages work/secureboot-tools
          work/secureboot-tools/bin/pip install --no-deps virt-firmware==26.10 pefile==2024.8.26
          work/secureboot-tools/bin/python -c 'import cryptography, yaml, requests, pefile'
      - run: python3 -m unittest discover -s tests/secureboot -v
      - name: Actual OVMF signature rejection and signed recovery
        run: bash tests/secureboot/firmware.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: firmware-acceptance-reports
          path: out/secureboot/
          retention-days: 14
