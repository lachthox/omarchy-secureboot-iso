name: Firmware signature and update transaction acceptance
on:
  push:
    branches: [codex/guarded-wizard]
    paths: ['tests/secureboot/firmware*', 'tests/secureboot/test_bootstore.py', 'installer/secureboot/**', '.github/workflows/security-primitives.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/install-tools.sh build
      - name: Discover EFI development tooling
        run: |
          apt-cache policy systemd-boot-efi systemd-ukify shim-signed
          sudo apt-get install -y --no-install-recommends gnu-efi=3.0.15-1build1 python3-cryptography=41.0.7-4ubuntu0.4 python3-yaml=6.0.1-2build2 python3-requests=2.31.0+dfsg-1ubuntu1.2
          python3 -m venv --system-site-packages work/secureboot-tools
          work/secureboot-tools/bin/pip install --no-deps virt-firmware==26.10 pefile==2024.8.26
          work/secureboot-tools/bin/python -c 'import cryptography, yaml, requests, pefile'
      - run: python3 -m unittest discover -s tests/secureboot -v
      - name: Actual OVMF signature rejection and signed recovery
        run: bash tests/secureboot/firmware.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: firmware-acceptance-reports
          path: out/secureboot/
          retention-days: 14
