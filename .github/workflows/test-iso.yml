name: Retest an existing ISO artifact
on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
      full_install:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Build run ID with an ISO artifact (failed tests may be debugged)
        required: true
        type: string
      full_install:
        description: Include slower full installation test
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Resolve build revision
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.build_run_id }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > /tmp/build-run.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/build-run.json'))
          assert r['path']=='.github/workflows/build-iso.yml'
          assert r['repository']['full_name']==os.environ['GH_REPO']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('sha='+r['head_sha']+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download once for all scenarios
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: diagnostic-iso
          path: out/image
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Match image provenance to selected build and harness compatibility
        env:
          IMAGE_COMMIT: ${{ steps.build.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json,os
          m=json.load(open('out/image/build-metadata.json')); c=json.load(open('configs/upstream.json'))
          assert m['commit']==os.environ['IMAGE_COMMIT']
          assert m['upstream']['sha256']==c['sha256']
          assert m.get('test_harness_protocol')==1
          PY
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf dosfstools mtools gdisk xorriso
      - uses: ./.github/actions/vm-test
        with:
          full_install: ${{ inputs.full_install || false }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: qemu-retest
          path: out/qemu/
          retention-days: 14
