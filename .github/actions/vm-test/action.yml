name: Test existing ISO without downloading it
description: Run QEMU against the ISO already in the runner workspace
inputs:
  full_install:
    description: Include slower upstream unattended installation
    default: 'false'
runs:
  using: composite
  steps:
    - name: Verify runner-local image once
      shell: bash
      run: |
        mkdir -p out/qemu
        (cd out/image && sha256sum -c SHA256SUMS)
    - name: UEFI CD boot and denied-write controls
      shell: bash
      run: /usr/bin/time -v -o out/qemu/cdrom-time.txt env SCENARIO=cdrom ISO_PREVERIFIED=1 bash tests/qemu/boot.sh
    - name: UEFI USB boot and denied-write controls
      shell: bash
      run: /usr/bin/time -v -o out/qemu/usb-time.txt env SCENARIO=usb ISO_PREVERIFIED=1 bash tests/qemu/boot.sh
    - name: Changed device order and denied-write controls
      shell: bash
      run: /usr/bin/time -v -o out/qemu/reordered-time.txt env SCENARIO=reordered ISO_PREVERIFIED=1 bash tests/qemu/boot.sh
    - name: Reject an unrecognized target without writes
      shell: bash
      run: /usr/bin/time -v -o out/qemu/invalid-time.txt env SCENARIO=invalid ISO_PREVERIFIED=1 bash tests/qemu/boot.sh
    - name: Publish small smoke reports before longer installation testing
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: smoke-reports-${{ github.run_id }}
        path: out/qemu/
        retention-days: 7
    - name: Upstream unattended install inside the same write boundary
      if: inputs.full_install == 'true'
      shell: bash
      run: /usr/bin/time -v -o out/qemu/install-time.txt env SCENARIO=install ISO_PREVERIFIED=1 bash tests/qemu/boot.sh
    - name: Actual guarded wizard and installed-system boot
      if: inputs.full_install == 'true'
      shell: bash
      run: /usr/bin/time -v -o out/qemu/wizard-time.txt env SCENARIO=wizard ISO_PREVERIFIED=1 bash tests/qemu/boot.sh
    - name: Interrupt an actual package-writing installation
      if: inputs.full_install == 'true'
      shell: bash
      run: /usr/bin/time -v -o out/qemu/interrupted-time.txt env SCENARIO=interrupted ISO_PREVERIFIED=1 bash tests/qemu/boot.sh
